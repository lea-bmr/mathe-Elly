<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5bd6">
<title>Mathe an der Elly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: App-Shell. Desktop: Kopfleiste mit Navigation. Handy: App-Bar oben, Tab-Leiste unten, Listenansichten, Details aufklappbar. */
:root {
  --ink: #142037; --paper: #f2f5fa; --card: #ffffff; --line: #e1e6ef; --muted: #5f6c83;
  --accent: #1d5bd6; --accent-soft: #e7eefc; --on-accent: #ffffff;
  --ar: #1d5bd6; --ar-soft: #e4ecfd; --fu: #8a3ffc; --fu-soft: #f1e9ff;
  --ge: #0f8a5f; --ge-soft: #e2f4ec; --st: #d9640b; --st-soft: #fdeedf;
  --ka: #c42b4b; --ka-soft: #fde7eb; --ok-soft: #e2f4ec;
  --shadow: 0 1px 2px rgba(20, 32, 55, .06), 0 4px 14px rgba(20, 32, 55, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --tabh: 62px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eef8; --paper: #0d1320; --card: #161f31; --line: #26314a; --muted: #9aa8c1;
    --accent: #7aa7ff; --accent-soft: #1c2a48; --on-accent: #0d1320;
    --ar: #7aa7ff; --ar-soft: #1b2946; --fu: #b993ff; --fu-soft: #2a2145; --ge: #4fd1a1; --ge-soft: #12312a; --st: #ffa25c; --st-soft: #392514;
    --ka: #ff7a93; --ka-soft: #3c1a23; --ok-soft: #12312a; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eef8; --paper: #0d1320; --card: #161f31; --line: #26314a; --muted: #9aa8c1;
  --accent: #7aa7ff; --accent-soft: #1c2a48; --on-accent: #0d1320;
  --ar: #7aa7ff; --ar-soft: #1b2946; --fu: #b993ff; --fu-soft: #2a2145; --ge: #4fd1a1; --ge-soft: #12312a; --st: #ffa25c; --st-soft: #392514;
  --ka: #ff7a93; --ka-soft: #3c1a23; --ok-soft: #12312a; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Kopfleiste */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 800 18px var(--display); }
.brand b { font: 800 18px var(--display); white-space: nowrap; }
.back { display: none; border: 0; background: none; padding: 6px; margin-left: -6px; border-radius: 10px; color: var(--accent); align-items: center; gap: 2px; text-decoration: none; font-weight: 600; }
.apptitle { display: none; font: 800 17px var(--display); flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dnav { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
.dnav a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: 9px; font-weight: 600; font-size: 15px; }
.dnav a:hover { background: var(--accent-soft); }
.dnav a.on { background: var(--accent); color: var(--on-accent); }
.sbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; display: flex; gap: 8px; align-items: center; color: var(--muted); cursor: pointer; min-width: 200px; }

main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 70px; }

/* Tab-Leiste (nur Handy) */
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabh); }
.tabbar a, .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; cursor: pointer; }
.tabbar .on { color: var(--accent); }

/* Bausteine */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: grid; gap: 12px; }
.sec { margin-top: 24px; display: grid; gap: 10px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sechead a { font-size: 14px; font-weight: 600; text-decoration: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--soft, var(--accent-soft)); color: var(--c, var(--accent)); text-decoration: none; white-space: nowrap; }
.chip.ka { --soft: var(--ka-soft); --c: var(--ka); }
.chip.free { --soft: var(--line); --c: var(--muted); }
.if-ar { --c: var(--ar); --soft: var(--ar-soft); } .if-fu { --c: var(--fu); --soft: var(--fu-soft); }
.if-ge { --c: var(--ge); --soft: var(--ge-soft); } .if-st { --c: var(--st); --soft: var(--st-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* Segment-Umschalter Jahrgänge */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.seg::-webkit-scrollbar { display: none; }
.seg a { flex: none; min-width: 52px; text-align: center; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font: 800 16px var(--display); }
.seg a.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Listenzeilen */
.rows { display: grid; overflow: hidden; }
.row { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px 12px 0; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); min-height: 64px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
.row .bar { align-self: stretch; background: var(--c); border-radius: 0 4px 4px 0; }
.row .t { font-weight: 700; line-height: 1.25; }
.row .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
.row .r { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.row.dash .bar { background: repeating-linear-gradient(var(--c) 0 6px, transparent 6px 10px); }

/* Jahresstreifen */
.strip { display: flex; gap: 3px; height: 34px; border-radius: 10px; overflow: hidden; }
.strip a { background: var(--soft); border-top: 4px solid var(--c); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--c); text-decoration: none; min-width: 0; }
.strip a.dash { opacity: .75; }
.stripleg { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }

/* Startseite */
.hello { display: grid; gap: 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { text-decoration: none; color: var(--ink); padding: 14px; display: grid; gap: 4px; position: relative; overflow: hidden; }
.tile .n { font: 800 40px/1 var(--display); color: var(--accent); }
.tile .s { font-size: 13px; color: var(--muted); }
.tile .mini { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 4px; overflow: hidden; }
.tile .mini span { background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { padding: 12px 14px; }
.stat b { display: block; font: 800 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

/* Themenseite */
.thead { display: grid; gap: 10px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.facts b { display: block; font: 800 20px/1.1 var(--display); }
.facts span { font-size: 12px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { counter-increment: s; content: counter(s); font: 800 13px var(--display); color: var(--accent); background: var(--accent-soft); border-radius: 8px; text-align: center; padding: 2px 0; }
.steps li.note { grid-template-columns: 28px 1fr; color: var(--muted); font-style: italic; font-size: 14px; }
.steps li.note::before { content: "i"; counter-increment: none; background: var(--line); color: var(--muted); font-style: normal; }
.steps .pg { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flow h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.flow ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.flow a.chip { margin-right: 4px; }
.kacard { padding: 14px 16px; display: grid; gap: 4px; border-left: 5px solid var(--ka); }
.kacard.no { border-left-color: var(--line); }
.kacard b { color: var(--ka); }
.kacard.no b { color: var(--muted); }

/* Aufklappbereiche */
.acc { display: grid; gap: 10px; }
details.card > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-weight: 700; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft, var(--accent-soft)); color: var(--c, var(--accent)); flex: none; }
details.card > summary .lbl { flex: 1; }
details.card > summary .lbl small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
details.card > summary .chev { transition: transform .2s; color: var(--muted); }
details.card[open] > summary .chev { transform: rotate(90deg); }
details.card .body { padding: 0 16px 16px; display: grid; gap: 10px; font-size: 15px; }
.body ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.kl { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.kl .lab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.task { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.task p { margin: 0; }
.task button { justify-self: start; border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 14px; }
.task .sol { display: none; padding: 9px 11px; border-radius: 10px; background: var(--ok-soft); }
.task.open .sol { display: block; }
.prozess { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.prozess div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.prozess b { display: block; margin-bottom: 4px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.pager a { text-decoration: none; color: var(--ink); padding: 12px 14px; font-size: 15px; font-weight: 600; line-height: 1.3; }
.pager a small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.pager a.next { text-align: right; grid-column: 2; }

/* Klassenarbeiten */
.kalist { display: grid; }
.karow { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: start; text-decoration: none; color: var(--ink); }
.karow:last-child { border-bottom: 0; }
.karow .nr { font: 800 15px var(--display); color: var(--ka); }
.karow.prep .nr { color: var(--muted); font-size: 13px; }
.karow .th { font-weight: 700; line-height: 1.3; }
.karow .an { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* Spirale */
.threads { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.thread { padding: 14px; display: grid; gap: 10px; }
.thread .path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.matrix { overflow-x: auto; }
.mx { display: grid; grid-template-columns: 120px repeat(6, minmax(120px, 1fr)); gap: 6px; min-width: 880px; padding: 14px; }
.mx .h { font: 800 14px var(--display); padding: 4px 6px; }
.mx .rh { font-weight: 700; font-size: 14px; padding: 8px; border-radius: 10px; background: var(--soft); color: var(--c); overflow-wrap: anywhere; }
.mx .cx { display: flex; flex-direction: column; gap: 4px; }
.mx .cx a { white-space: normal; border-radius: 8px; font-size: 12px; line-height: 1.25; padding: 4px 7px; }

/* Suche */
.search { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
.search.show { display: flex; }
.search-top { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
.search-top input { flex: 1; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.search-top button { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 8px; }
.search-res { overflow: auto; padding: 12px 16px 40px; max-width: 760px; width: 100%; margin: 0 auto; }
.search-res .hint { color: var(--muted); font-size: 14px; padding: 8px 2px; }

/* Handy */
@media (max-width: 760px) {
  .dnav, .sbtn, .brand b { display: none; }
  .apptitle { display: block; }
  .back.show { display: inline-flex; }
  .brand.hide { display: none; }
  .tabbar { display: block; }
  main { padding: 16px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px); }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .flow { grid-template-columns: 1fr; }
  .facts b { font-size: 18px; }
  .row { min-height: 60px; }
  h1.big { font-size: 28px; }
  .desk { display: none; }
}
@media (min-width: 761px) { .mob { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

alten. Die Parabel muss nicht vorgezogen werden: Sekundo 10 beginnt bei der Normalparabel."]]],"10":[["Nr. 1","Quadratische Funktionen und quadratische Gleichungen",["Sekundo 10, Kap. 2 (S. 37–64)","Kap. 1 Basiswissen als Check-in zu Beginn."]],["Nr. 2","Potenzen, Wurzeln, Wachstum und Zerfall","Sekundo 10, Kap. 4 und Kap. 6 (S. 93–112, S. 137–162)"],["Nr. 3",["Trigonometrie","Körperberechnung – Pyramide, Kegel, Kugel"],["Sekundo 10, Kap. 3 und Kap. 5 (S. 65–92, S. 113–136)","Inkl. Sinusfunktion; Sinus-/Kosinussatz optional."]],["Nr. 4 (Training für die Abschlussprüfung)",["Daten und Zufall (Vierfeldertafel, Kombinatorik)","Prüfungsvorbereitung"],["Sekundo 10, Kap. 7 und Kap. 8 (S. 163–199)","Die Klassenarbeit Nr. 4 orientiert sich an der Struktur einer ZP zur Vorbereitung der Abschlussprüfung."]]]},"KLP":{"5":"Mathematik 1. Auflage 2022: S. 20–25 (prozessbezogen) und S. 26–31","6":"Mathematik 1. Auflage 2022: S. 20–25 (prozessbezogen) und S. 26–31","7":"Mathematik 1. Auflage 2022: S. 20–25 (prozessbezogen) und S. 32–36","8":"Mathematik 1. Auflage 2022: S. 20–25 (prozessbezogen) und S. 32–36","9":"Mathematik 1. Auflage 2022: S. 20–25 (prozessbezogen) und S. 37–41","10":"Mathematik 1. Auflage 2022: S. 20–25 (prozessbezogen) und S. 37–41"},"STD":{"5":5,"6":5,"7":4,"8":4,"9":4,"10":4},"BUCH":{"5":"Sekundo Mathematik 5 – Differenzierende Ausgabe NRW 2022","6":"Sekundo Mathematik 6 – Differenzierende Ausgabe NRW 2022","7":"Sekundo Mathematik 7 – Differenzierende Ausgabe NRW 2023","8":"Sekundo Mathematik 8 – Differenzierende Ausgabe NRW","9":"Sekundo Mathematik 9 – Differenzierende Ausgabe NRW 2025","10":"Sekundo Mathematik 10 – Differenzierende Ausgabe NRW"},"BSP":{"05-1":[["Runde 3 486 529 auf Zehntausender und schreibe das Ergebnis in Worten.","3 490 000 – drei Millionen vierhundertneunzigtausend."],["In einer Strichliste stehen bei „Fußball“ 4 Fünferbündel und 3 Striche. Wie viele Kinder sind das?","4 · 5 + 3 = 23 Kinder."]],"05-2":[["Rechne geschickt: 287 + 145 + 13 + 55","(287 + 13) + (145 + 55) = 300 + 200 = 500. Genutzt: Kommutativ- und Assoziativgesetz."],["Überschlage zuerst, dann rechne schriftlich: 4 382 − 1 795","Überschlag: 4 400 − 1 800 = 2 600. Genau: 2 587."]],"05-3":[["Wie viele Flächen, Kanten und Ecken hat ein Quader?","6 Flächen, 12 Kanten, 8 Ecken."],["Zeichne A(1|2), B(6|2), C(6|5) und D(1|5) und verbinde sie. Welche Figur entsteht?","Ein Rechteck, 5 Längeneinheiten lang und 3 breit."]],"05-4":[["Rechne vorteilhaft: 25 · 17 · 4","25 · 4 = 100, dann 100 · 17 = 1 700."],["Setze x = 7 in den Term 3 · x + 5 ein.","3 · 7 + 5 = 26."],["Schriftlich: 7 344 : 6","1 224"]],"05-5":[["Wandle um: 3,25 m in cm und 4 500 g in kg.","325 cm und 4,5 kg."],["Karte im Maßstab 1 : 50 000: Wie weit sind 4 cm auf der Karte in Wirklichkeit?","4 · 50 000 cm = 200 000 cm = 2 km."]],"05-6":[["Ein Beet ist 8 m lang und 5 m breit. Berechne Flächeninhalt und Umfang.","A = 8 m · 5 m = 40 m², u = 2 · 8 m + 2 · 5 m = 26 m."],["Ein Rechteck hat A = 48 cm² und a = 6 cm. Wie breit ist es?","b = 48 : 6 = 8 cm."]],"05-7":[["Wie viel sind 3/4 von 20 €?","20 € : 4 = 5 €, dann 5 € · 3 = 15 €."],["Welcher Bruchteil eines Kuchens ist übrig, wenn 5 von 8 Stücken gegessen wurden?","3/8"]],"06-1":[["Ist 4 572 durch 3, durch 4 und durch 9 teilbar?","Quersumme 18 → durch 3 und 9 teilbar. Die letzten zwei Ziffern 72 sind durch 4 teilbar → ja, durch alle drei."],["Bestimme ggT(24, 36) und kgV(6, 8).","ggT = 12, kgV = 24."],["Morgens −7 °C, mittags 12 Grad wärmer. Wie warm ist es mittags?","5 °C"]],"06-2":[["Von 24 Schülern fahren 2/3 mit dem Bus. Wie viele sind das?","24 : 3 = 8, 8 · 2 = 16 Schüler."],["Ein Viertel einer Strecke sind 3 km. Wie lang ist die ganze Strecke?","3 km · 4 = 12 km."]],"06-3":[["Kürze 18/24 vollständig.","ggT(18, 24) = 6 → 3/4"],["Was ist größer: 3/5 oder 5/8?","Erweitern auf 40: 24/40 < 25/40 → 5/8 ist größer."],["Berechne 2/3 + 1/4","Hauptnenner 12: 8/12 + 3/12 = 11/12"]],"06-4":[["Ein Winkel ergänzt 65° zu einem gestreckten Winkel. Wie groß ist er, und welche Winkelart ist das?","180° − 65° = 115°, ein stumpfer Winkel."],["Wie viele Symmetrieachsen hat ein Quadrat? Ist es punktsymmetrisch?","4 Symmetrieachsen, und ja, es ist punktsymmetrisch."]],"06-5":[["Berechne 3,6 · 0,25 und 12,6 : 0,3","0,9 und 126 : 3 = 42."],["Schreibe 3/8 als Dezimalzahl und in Prozent.","0,375 = 37,5 %"]],"06-6":[["Ein Quader ist 5 cm lang, 4 cm breit und 3 cm hoch. Berechne Volumen und Oberfläche.","V = 60 cm³, O = 2 · (20 + 15 + 12) cm² = 94 cm²."],["Wie viele Liter passen in ein Aquarium mit 2 dm × 3 dm × 5 dm?","30 dm³ = 30 Liter."]],"06-7":[["Noten: 2, 3, 3, 1, 4, 2, 5. Bestimme Mittelwert, Median und Spannweite.","Mittelwert 20 : 7 ≈ 2,86. Sortiert: 1, 2, 2, 3, 3, 4, 5 → Median 3. Spannweite 5 − 1 = 4."],["25 % der Klasse kommen mit dem Bus. Wie groß ist der Winkel im Kreisdiagramm?","25 % von 360° = 90°."]],"07-1":[["Berechne 3/4 · 2/9 und 5/6 : 10/3","6/36 = 1/6 und 5/6 · 3/10 = 15/60 = 1/4."],["Berechne (−8) + 5 und (−6) · (−4).","−3 und 24."],["Ordne: −1,5; 0,3; −2; 1/2","−2 < −1,5 < 0,3 < 1/2"]],"07-2":[["3 kg Äpfel kosten 4,50 €. Was kosten 5 kg?","Proportional: 1 kg kostet 1,50 €, 5 kg kosten 7,50 €."],["4 Maler brauchen 6 Tage. Wie lange brauchen 3 Maler?","Antiproportional: 4 · 6 = 24 Maler-Tage, 24 : 3 = 8 Tage."]],"07-3":[["Eine Jacke kostet 80 € und wird um 15 % reduziert. Wie viel kostet sie jetzt?","15 % von 80 € = 12 €, neuer Preis 68 €."],["18 von 24 Schülern haben ein Haustier. Wie viel Prozent sind das?","18 : 24 = 0,75 = 75 %."]],"07-4":[["Wie groß ist die Wahrscheinlichkeit, mit einem Würfel eine Zahl größer als 4 zu werfen?","Günstig: 5 und 6 → 2/6 = 1/3 ≈ 33 %."],["Nenne das Gegenereignis zu „gerade Zahl“ und seine Wahrscheinlichkeit.","„ungerade Zahl“, P = 1/2."]],"07-5":[["In einem Dreieck ist α = 48° und β = 67°. Wie groß ist γ?","γ = 180° − 48° − 67° = 65°."],["Lässt sich ein Dreieck mit a = 3 cm, b = 4 cm und c = 8 cm konstruieren?","Nein, denn 3 + 4 < 8. Die beiden kürzeren Seiten reichen nicht."]],"07-6":[["Löse: 5x − 4 = 2x + 11","3x = 15 → x = 5. Probe: 21 = 21."],["Stelle einen Term für den Umfang eines Rechtecks mit der Länge a und der Breite 3 auf.","u = 2a + 6"]],"08-1":[["Multipliziere aus: (x + 3)² und (2a − 1)(2a + 1)","x² + 6x + 9 (1. binomische Formel) und 4a² − 1 (3. binomische Formel)."],["Löse: 2(x − 3) = 4x + 2","2x − 6 = 4x + 2 → −2x = 8 → x = −4."],["Handytarif: 5 € Grundgebühr plus 0,10 € pro Minute. Stelle den Zuordnungsterm auf.","y = 0,1x + 5. Das ist eine lineare Zuordnung, aber nicht proportional."]],"08-2":[["Ein Trapez hat a = 8 cm, c = 4 cm und h = 5 cm. Berechne den Flächeninhalt.","A = (8 + 4) : 2 · 5 = 30 cm²."],["In einem Viereck sind drei Winkel 90°, 85° und 110° groß. Wie groß ist der vierte?","360° − 285° = 75°."]],"08-3":[["Daten: 3, 5, 6, 7, 8, 9, 12. Bestimme die fünf Kennwerte für einen Boxplot.","Minimum 3, unteres Quartil 5, Median 7, oberes Quartil 9, Maximum 12."],["Mit welcher Formel berechnet eine Tabellenkalkulation den Mittelwert von B2 bis B20?","=MITTELWERT(B2:B20)"]],"08-4":[["Ein Preis von 250 € steigt um 8 %. Nenne den Wachstumsfaktor und den neuen Preis.","q = 1,08, neuer Preis 250 € · 1,08 = 270 €."],["Wie viele Zinsen bringen 2 400 € bei 2,5 % in 7 Monaten?","2 400 € · 0,025 · 7/12 = 35 €."]],"08-5":[["Ein Prisma hat ein Dreieck als Grundfläche (g = 6 cm, h = 4 cm) und ist 10 cm hoch. Berechne das Volumen.","G = 6 · 4 : 2 = 12 cm², V = 12 cm² · 10 cm = 120 cm³."]],"08-6":[["Eine Gerade hat die Steigung 2 und schneidet die y-Achse bei −1. Stelle die Funktionsgleichung auf. Liegt P(3|5) auf der Geraden?","y = 2x − 1. 2 · 3 − 1 = 5 → ja."]],"09-1":[["Bestimme die Gerade durch A(1|3) und B(4|9).","m = (9 − 3) : (4 − 1) = 2. 3 = 2 · 1 + n → n = 1. Also y = 2x + 1."],["Tarif A: 10 € plus 0,05 € pro Minute. Tarif B: 0,15 € pro Minute. Ab wann lohnt sich A?","10 + 0,05x = 0,15x → x = 100. Ab 100 Minuten ist A günstiger."]],"09-2":[["Schreibe in Standardschreibweise: 0,00042 und 3 500 000","4,2 · 10⁻⁴ und 3,5 · 10⁶"],["Die Katheten sind 6 cm und 8 cm lang. Wie lang ist die Hypotenuse?","c = √(36 + 64) = √100 = 10 cm."]],"09-3":[["Ein Kreis hat r = 5 cm. Berechne Umfang und Flächeninhalt.","u = 2 · π · 5 ≈ 31,4 cm, A = π · 25 ≈ 78,5 cm²."],["Ein Foto (10 cm × 15 cm) wird mit dem Faktor 2 vergrößert. Wie ändern sich Seiten und Fläche?","20 cm × 30 cm. Die Fläche wird viermal so groß."]],"09-4":[["Ein Zylinder hat r = 3 cm und h = 10 cm. Berechne das Volumen.","V = π · 9 · 10 ≈ 282,7 cm³."],["Eine Münze wird zweimal geworfen. P(zweimal Kopf)? P(mindestens einmal Zahl)?","1/2 · 1/2 = 1/4 und über das Gegenereignis 1 − 1/4 = 3/4."],["Warum täuscht ein Säulendiagramm, dessen y-Achse bei 90 statt bei 0 beginnt?","Kleine Unterschiede wirken viel größer, als sie sind."]],"09-5":[["Ein Fahrrad kostet 600 €. Es gibt 10 % Rabatt und danach 2 % Skonto. Wie hoch ist der Endpreis?","600 € · 0,9 = 540 €, dann 540 € · 0,98 = 529,20 €."]],"10-1":[["Nenne den Scheitelpunkt von y = (x − 2)² + 3 und die Öffnung.","S(2|3), nach oben geöffnet."],["Löse x² − 6x + 8 = 0 mit der p-q-Formel.","x = 3 ± √(9 − 8) = 3 ± 1 → x₁ = 4, x₂ = 2."],["Bringe y = x² + 4x + 1 in die Scheitelpunktform.","y = (x + 2)² − 3, also S(−2|−3)."]],"10-2":[["Vereinfache: a³ · a⁵ und (x²)⁴","a⁸ und x⁸."],["Eine Bakterienkultur mit 500 Bakterien verdoppelt sich jede Stunde. Wie viele sind es nach 6 Stunden?","500 · 2⁶ = 32 000."],["Nach wie vielen Jahren hat sich ein Kapital bei 5 % Zinsen verdoppelt?","1,05ˣ = 2 → x = log 2 : log 1,05 ≈ 14,2 Jahre."]],"10-3":[["Ein rechtwinkliges Dreieck hat eine 10 cm lange Hypotenuse und α = 30°. Wie lang ist die Gegenkathete?","a = 10 cm · sin 30° = 5 cm."],["Ein Kegel hat r = 3 cm und h = 4 cm. Berechne Mantellinie und Volumen.","s = √(9 + 16) = 5 cm, V = 1/3 · π · 9 · 4 ≈ 37,7 cm³."]],"10-4":[["Von 100 Personen rauchen 40. Von den Rauchern husten 30, von den Nichtrauchern 10. Erstelle eine Vierfeldertafel und berechne P(Husten | Raucher).","Husten: 30 | 10 | 40 – kein Husten: 10 | 50 | 60 – Summe: 40 | 60 | 100. P = 30 : 40 = 75 %."],["Wie viele dreistellige Zahlencodes gibt es mit den Ziffern 0 bis 9?","10 · 10 · 10 = 1 000."]]},"CHANGES":[["5","Kap. 3 „Körper“ fehlte, obwohl Körper erkennen und Netze Pflicht in 5/6 sind.","Zusammen mit „Zeichnen und Konstruieren“ als Block 05-3."],["5/6","„Terme mit Variablen einsetzen“ (KLP 5/6) war nirgends verortet.","Ergänzt in 05-4."],["6","Daten sollte in Klasse 7 mit dem Buch aus Klasse 6 nachgeholt werden, das dann fehlt.","Daten fest am Ende von Klasse 6 (06-7)."],["6","Multiplikation/Division von Brüchen (KLP 7/8) war 6. Thema in Klasse 6.","Wandert nach 07-1."],["6","Kürzen/Erweitern getrennt vom Rechnen mit Brüchen.","Verfeinern/Vergröbern, Kürzen/Erweitern und Größenvergleich direkt vor dem Hauptnenner in 06-3."],["7","Mult./Div. von Brüchen und Dreiecke ohne Klassenarbeit, Vorhaben falsch nummeriert („06-2“).","Brüche mit rationalen Zahlen kombiniert (07-1), Dreiecke als Klassenarbeit (07-5)."],["7","Kap. 7 „Flächeninhalt und Volumen“ doppelte sich mit Klasse 8.","Wird übersprungen (Inhalte in 08-2 und 08-5)."],["8","Binomische Formeln standen im Plan, die angegebenen Seiten enthielten sie aber nicht.","Kap. 8 in 08-1 aufgenommen."],["8","Lineare Zuordnungen (KLP 7/8) nur im Puffer-Block.","S. 48 fest in 08-1."],["8","Boxplot und Quartile (KLP 7/8) fehlten.","LSE-Block 08-3 mit Tabellenkalkulation."],["8/9","Lineare Funktionen doppelt unterrichtet.","In 08-6 nur als Puffer, vollständig in 09-1."],["9","Vierfeldertafel eingeplant, steht aber nicht in Sekundo 9.","Wandert nach 10-4."],["9","„Parabel“ als Vorbereitung, obwohl Sekundo 10 bei null beginnt.","Ersetzt durch Prozent und Zinsen (09-5)."],["10","Daten und Zufall (Vierfeldertafel, Kombinatorik), Sinusfunktion und Messreihen fehlten.","10-4 vor der ZP, Sinusfunktion in 10-3, Messreihen in 10-2."]]};

  const steps = b.umsetzung.map(u => { const [t, pg] = splitPg(u); const note = !pg && /entf|Puffer|Pflicht|Ergänzung|Optional|ZP-relevant|Ca\. 6|Check-in|Taschenrechner wird|S\. 63/.test(u);

    <div class="facts">
      <div><b>${b.wochen} Wo.</b><span>${STD[b.jg] * b.wochen} U-Std.</span></div>
      <div><b style="color:${isKA(b) ? "var(--ka)" : "var(--muted)"}">${kaShort(b)}</b><span>${isKA(b) ? "Klassenarbeit" : "ohne Arbeit"}</span></div>
      <div><b>${b.id}</b><span>Klasse ${b.jg}, Block ${b.nr}</span></div>
    </div>
  </section>
  <section class="sec"><div class="sechead"><h2>Das kommt dran</h2><span class="muted small">${esc(BUCH[b.jg].split(" –")[0])}</span></div>
    <div class="card"><ol class="steps">${steps}</ol></div></section>
  <section class="sec"><div class="flow">
    <div class="card pad"><h3>Baut auf</h3><ul>${back.map(chipRefs).join("")}</ul></div>
    <div class="card pad"><h3>Führt weiter zu</h3><ul>${fwd.map(chipRefs).join("")}</ul></div></div></section>
  <section class="sec">${kaRow
    ? `<a class="card kacard" href="#ka-${b.jg}" style="text-decoration:none;color:var(--ink)"><b>${esc(kaRow[0])}: ${esc([].concat(kaRow[1]).join(", "))}</b><span class="muted small">${esc([].concat(kaRow[2]).join(" "))}</span></a>`
    : `<div class="card kacard no"><b>${esc(b.ka)}</b><span class="muted small">Dieser Block wird nicht in einer eigenen Klassenarbeit geprüft.</span></div>`}</section>
  <section class="sec"><h2>Vertiefen</h2><div class="acc">
    ${acc("bulb", "", "Beispielaufgaben", `${bsp.length} Aufgaben mit Lösung`, bsp.map(([a, l], k) => `<div class="task"><p><b>${k + 1}.</b> ${esc(a)}</p><button type="button" aria-expanded="false">Lösung zeigen</button><div class="sol">${esc(l)}</div></div>`).join(""))}
    ${acc("target", "if-" + mainIf(b), "Kompetenzen laut Kernlehrplan", b.if.map(f => f.name).join(" · "), `<p class="muted small" style="margin:0">${esc(KLP[b.jg])}</p>` + b.if.map(f => `<div class="kl if-${ifKey(f.name)}"><span class="chip if-${ifKey(f.name)}" style="justify-self:start">${esc(f.name)}</span><span class="lab">Inhaltliche Schwerpunkte</span><ul>${f.sp.map(s => `<li>${esc(s)}</li>`).join("")}</ul><span class="lab">Die Schülerinnen und Schüler …</span><ul>${f.k.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`).join(""))}
    ${acc("gear", "if-fu", "Prozessbezogene Kompetenzen", "Operieren, Modellieren, Problemlösen, Argumentieren, Kommunizieren", `<div class="prozess">${[["Operieren", "op"], ["Modellieren", "mo"], ["Problemlösen", "pl"], ["Argumentieren", "ar"], ["Kommunizieren", "ko"]].map(([n, k]) => `<div><b>${n}</b><ul>${b.p[k].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>`)}
    ${acc("rocket", "if-st", "Mathematik in der Praxis", `${b.praxis.length} Projektideen`, `<ul>${b.praxis.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`)}
    ${acc("book", "if-ge", "Lehrwerk und Material", esc(b.lehrwerk[0]), `<ul><li>${esc(BUCH[b.jg])}: ${esc(b.lehrwerk[0])}</li>${b.lehrwerk.slice(1).map(x => `<li>Sekundo Mathematik ${b.jg} – ${esc(x)}</li>`).join("")}</ul>`)}
  </div></section>
  <nav class="pager">${prev ? `<a class="card" href="#t-${prev.id}"><small>← ${prev.id}</small>${esc(prev.thema)}</a>` : ""}${next ? `<a class="card next" href="#t-${next.id}"><small>${next.id} →</small>${esc(next.thema)}</a>` : ""}</nav>`;
  document.querySelectorAll(".task button").forEach(btn => btn.onclick = () => { const o = btn.parentElement.classList.toggle("open"); btn.textContent = o ? "Lösung verbergen" : "Lösung zeigen"; btn.setAttribute("aria-expanded", o); });
}

const THREADS = [["Brüche und Zahlbereiche", ["05-7", "06-2", "06-3", "06-5", "07-1", "09-2", "10-2"]], ["Zuordnungen und Funktionen", ["05-1", "07-2", "08-1", "08-6", "09-1", "10-1", "10-2"]], ["Terme und Gleichungen", ["05-4", "07-6", "08-1", "09-1", "10-1"]], ["Flächen und Körper", ["05-3", "05-6", "06-6", "08-2", "08-5", "09-3", "09-4", "10-3"]], ["Dreiecke und Winkel", ["06-4", "07-5", "08-2", "09-2", "10-3"]], ["Prozent und Wachstum", ["06-5", "07-3", "08-4", "09-5", "10-2"]], ["Daten", ["05-1", "06-7", "08-3", "09-4", "10-4"]], ["Wahrscheinlichkeit", ["07-4", "09-4", "10-4"]]];
function viewSpiral() {
  shell("spirale", "Spiralprinzip");
  const cells = (k, j) => B.filter(b => b.jg === j && ifsOf(b).includes(k));
  $("#app").innerHTML = `
  <h1 class="desk">Spiralprinzip</h1>
  <p class="muted" style="margin:6px 0 0;max-width:62ch">Jedes Thema kommt in späteren Klassen vertieft wieder. Die roten Fäden zeigen, wie es weitergeht.</p>
  <section class="sec"><h2>Rote Fäden</h2><div class="threads">${THREADS.map(([t, ids]) => `<div class="card thread"><h3>${t}</h3><div class="path">${ids.map((x, k) => `<a class="chip if-${mainIf(byId[x])}" href="#t-${x}" title="${esc(byId[x].thema)}">${x}</a>${k < ids.length - 1 ? '<span class="muted">›</span>' : ""}`).join("")}</div></div>`).join("")}</div></section>
  <section class="sec">${acc("list", "", "Gesamtübersicht", "Alle Themen nach Inhaltsfeld und Klasse", `<div class="matrix"><div class="mx" style="padding:0"><div></div>${JGS.map(j => `<div class="h">Klasse ${j}</div>`).join("")}
    ${Object.entries(IFN).map(([k, n]) => `<div class="rh if-${k}">${n}</div>${JGS.map(j => `<div class="cx">${cells(k, j).map(b => `<a class="chip if-${k}" href="#t-${b.id}">${b.id} ${esc(b.thema)}</a>`).join("") || '<span class="muted small">–</span>'}</div>`).join("")}`).join("")}</div></div>`, window.innerWidth > 760)}</section>`;
}

function viewChanges() {
  shell("aenderungen", "Was ist neu?", ["#start", "Start"]);
  $("#app").innerHTML = `<h1 class="desk">Was ist neu?</h1>
  <p class="muted" style="margin:6px 0 0;max-width:62ch">Abgleich des bisherigen Plans und der Klassenarbeitsübersicht mit dem Kernlehrplan und den Sekundo-Büchern.</p>
  <section class="sec"><div class="card kalist">${CHANGES.map(([j, p, l]) => `<div class="karow" style="grid-template-columns:56px 1fr"><span class="nr" style="color:var(--accent)">Jg. ${esc(j)}</span><span><div class="th">${linkify(l)}</div><div class="an">Bisher: ${linkify(p)}</div></span></div>`).join("")}</div></section>`;
}

// Suche
const idx = B.map(b => ({ b, text: [b.id, b.thema, ...b.umsetzung, ...b.if.flatMap(f => [f.name, ...f.sp, ...f.k]), ...b.praxis].join(" ").toLowerCase() }));
function openSearch() { $("#search").classList.add("show"); $("#q").value = ""; renderRes(""); setTimeout(() => $("#q").focus(), 30); }
function closeSearch() { $("#search").classList.remove("show"); }
function renderRes(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) { $("#res").innerHTML = `<div class="hint">Begriff eingeben, zum Beispiel ggT, Boxplot oder Pythagoras.</div><div class="card rows" style="margin-top:8px">${["06-1", "08-3", "09-2", "10-1"].map(x => rowHtml(byId[x])).join("")}</div>`; return; }
  const hits = idx.filter(x => q.split(/\s+/).every(w => x.text.includes(w)));
  $("#res").innerHTML = hits.length ? `<div class="hint">${hits.length} Treffer</div><div class="card rows">${hits.map(({ b }) => rowHtml(b)).join("")}</div>` : `<div class="hint">Kein Treffer. Versuch es mit einem anderen Begriff.</div>`;
}
$("#q").addEventListener("input", e => renderRes(e.target.value));
$("#sclose").onclick = closeSearch; $("#sbtn").onclick = openSearch; $("#msearch").onclick = openSearch;
$("#res").addEventListener("click", e => { if (e.target.closest("a")) closeSearch(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSearch(); });

function route() {
  const h = location.hash.slice(1);
  if (/^jg-(\d+)$/.test(h)) viewJg(+h.slice(3));
  else if (/^ka-(\d+)$/.test(h)) viewKA(+h.slice(3));
  else if (h === "klassenarbeiten") viewKA(lastJg);
  else if (h.startsWith("t-")) viewTopic(h.slice(2));
  else if (h === "spirale") viewSpiral();
  else if (h === "aenderungen") viewChanges();
  else viewStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
